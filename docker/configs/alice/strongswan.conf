# strongSwan configuration for Alice (IKE initiator)
charon {
    start-scripts {
        creds = swanctl --load-creds
        conns = swanctl --load-conns
    }

    filelog {
        stderr {
            default = 2
            ike = 2
            cfg = 2
            lib = 2
        }
    }

    # Explicitly load required plugins including qkd, oqs (ML-KEM), curve25519
    load = random nonce openssl hmac pem pubkey x509 kernel-netlink socket-default vici curve25519 oqs qkd

    # IKE parameters
    send_vendor_id = yes
    prefer_configured_proposals = no
    fragment_size = 1472
    half_open_timeout = 20
    retransmit_timeout = 2
    retransmit_tries = 5

    # QKD plugin configuration
    plugins {
        qkd {
            # KME endpoints (HTTPS for TLS)
            master_kme_hostname = https://10.1.0.100:8443
            slave_kme_hostname = https://10.1.0.101:8443

            # SAE identifiers
            master_sae_id = alice
            slave_sae_id = bob

            # mTLS certificates for KME communication
            cert_path = /etc/swanctl/qkd/alice-sae.pem
            key_path = /etc/swanctl/qkd/alice-sae.key
            ca_cert_path = /etc/swanctl/qkd/ca.pem

            # Key parameters
            key_size = 256
            timeout = 30000
            retry_count = 3
        }
    }
}
