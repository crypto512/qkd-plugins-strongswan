# swanctl configuration for Bob (IKE responder)

connections {
    qkd-tunnel {
        version = 2
        local_addrs = 10.1.0.20
        remote_addrs = 10.1.0.10

        # IKE proposals with RFC 9370 multiple key exchanges:
        # KE1: curve25519 (ECDH), KE2: kyber3 (Kyber-768/ML-KEM-768), KE3: qkd
        proposals = aes256-sha256-prfsha256-curve25519-ke1_kyber3-ke2_qkd

        # Local identity
        local {
            auth = pubkey
            certs = bob.pem
            id = bob
        }

        # Remote identity
        remote {
            auth = pubkey
            cacerts = ca.pem
            id = alice
        }

        # Child SA (ESP)
        children {
            qkd-child {
                local_ts = 10.1.0.20/32
                remote_ts = 10.1.0.10/32
                esp_proposals = aes256-sha256
                start_action = trap
                dpd_action = restart
                close_action = restart
            }
        }

        # DPD
        dpd_delay = 30s

        # Rekey settings
        rekey_time = 4h
        reauth_time = 24h
    }
}

# Certificate authorities
authorities {
    qkd-ca {
        cacert = ca.pem
    }
}
